# LN Verifier — plano de controle (03 v2/v3). NAO EXECUTADO. Revisao DevOps/QA obrigatoria antes do primeiro run.
# Acoes fixadas por SHA completo (pins.md, DevOps, 22/11/2026) e imagem base do runner por digest (runner/Dockerfile). Reconfirmar antes do primeiro push.
# Falha fechada: qualquer passo ausente/errado => nenhum segredo usado, nenhuma tag assinada.
# v3 (QA): nenhuma expressao ${{ }} de entrada/contexto e interpolada dentro de 'run:'; tudo passa por env e e validado antes do uso.
name: ln-verifier
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      task:   {description: "ID da tarefa ou gate (ex.: R0-05)", required: true, type: string}
      target: {description: "SHA alvo (H no pre-merge, M no aceite)", required: true, type: string}
      mode:   {description: "premerge | accept", required: true, type: choice, options: [premerge, accept]}
permissions: {}
concurrency:
  group: ln-verifier
  cancel-in-progress: false
env:
  PRODUCT_REPO: mzinhoww-svg/loyaltynews
  GIT_CONFIG_NOSYSTEM: "1"

jobs:
  trust-gate:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      ok: ${{ steps.chain.outputs.ok }}
      verified_sha: ${{ steps.chain.outputs.verified_sha }}
    steps:
      - name: Disparo permitido (contexto so por env)
        env:
          GH_REF: ${{ github.ref }}
          GH_WSHA: ${{ github.workflow_sha }}
          GH_SHA: ${{ github.sha }}
          GH_EVENT: ${{ github.event_name }}
        run: |
          test "$GH_REF" = "refs/heads/main"
          test "$GH_WSHA" = "$GH_SHA"
          case "$GH_EVENT" in schedule|workflow_dispatch) ;; *) exit 1;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0, persist-credentials: false}
      - id: chain
        name: Cadeia raiz (antes de qualquer segredo)
        env:
          ROOT_FPR: ${{ vars.ROOT_FPR }}
          ROOT_PUBKEY: ${{ vars.ROOT_PUBKEY }}
          TRUST_ANCHOR_SHA: ${{ vars.TRUST_ANCHOR_SHA }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          bash scripts/verify_root_chain.sh
          python3 - <<'EOF'
          import hashlib, json
          t = json.load(open('trust.json', encoding='utf-8'))
          assert hashlib.sha256(open('checks/r0-policy.json', 'rb').read()).hexdigest() == t['runner_policy_sha256'], 'politica != trust'
          EOF
          echo "ok=true" >> "$GITHUB_OUTPUT"
          printf 'verified_sha=%s\n' "$TARGET_SHA" >> "$GITHUB_OUTPUT"

  guard:
    needs: trust-gate
    if: needs.trust-gate.outputs.ok == 'true'
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.trust-gate.outputs.verified_sha }}", persist-credentials: false}
      - name: Desvio de configuracao (variavel de parada ausente => falha)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LN_EMERGENCY_STOP: ${{ vars.LN_EMERGENCY_STOP }}
        run: python3 scripts/guard.py trust.json

  discover:
    needs: [trust-gate, guard]
    runs-on: ubuntu-latest
    permissions: {contents: read}
    outputs:
      run: ${{ steps.d.outputs.run }}
      task: ${{ steps.d.outputs.task }}
      target: ${{ steps.d.outputs.target }}
      mode: ${{ steps.d.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.trust-gate.outputs.verified_sha }}", path: trusted, persist-credentials: false}
      - id: d
        name: Alvo (manual validado, ou descoberta automatica sobre o clone publico do produto; so por env)
        env:
          GH_EVENT: ${{ github.event_name }}
          IN_TASK: ${{ inputs.task }}
          IN_TARGET: ${{ inputs.target }}
          IN_MODE: ${{ inputs.mode }}
        run: |
          if [ "$GH_EVENT" = "workflow_dispatch" ]; then
            [[ "$IN_TASK" =~ ^R[0-6]-[0-9]{2}$ ]] || { echo 'task invalida (use o id completo, ex.: R0-05 ou R0-12)'; exit 1; }
            [[ "$IN_TARGET" =~ ^[0-9a-f]{40}$ ]] || { echo 'target invalido'; exit 1; }
            [[ "$IN_MODE" =~ ^(accept|premerge)$ ]] || { echo 'mode invalido'; exit 1; }
            printf 'task=%s\ntarget=%s\nmode=%s\nrun=true\n' "$IN_TASK" "$IN_TARGET" "$IN_MODE" >> "$GITHUB_OUTPUT"
          else
            # agendado: descoberta (02 v3 par.2) sem credencial; um alvo por execucao; nada e assinado aqui
            git clone -q --no-checkout "https://github.com/${PRODUCT_REPO}.git" product
            git -C product fetch -q origin 'refs/tags/*:refs/tags/*'
            printf '* -text\n' > product/.git/info/attributes
            python3 -I -B trusted/scripts/discover.py --product product --trust trusted/trust.json --keys trusted/keys --limit 1 --out alvos.json > /dev/null
            python3 -I - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, re
          a = json.load(open('alvos.json', encoding='utf-8'))['alvos']
          if a and re.fullmatch(r'R[0-6]-[0-9]{2}', a[0]['task']) and re.fullmatch(r'[0-9a-f]{40}', a[0]['target']) and a[0]['mode'] == 'accept':
              print('task=%s\ntarget=%s\nmode=accept\nrun=true' % (a[0]['task'], a[0]['target']))
          else:
              print('run=false')
          EOF
            cat alvos.json   # registro no log (sem segredo): alvo escolhido e pulados com motivo
          fi

  fetch:
    needs: [trust-gate, discover]
    if: needs.discover.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Clonar produto publico no SHA alvo (sem credencial)
        env:
          TARGET: ${{ needs.discover.outputs.target }}
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || exit 1
          git clone --no-checkout "https://github.com/${PRODUCT_REPO}.git" product
          git -C product -c core.hooksPath=/dev/null checkout --detach "$TARGET"
          git -C product bundle create ../product.bundle --all
          sha256sum product.bundle | tee product.bundle.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: product-bundle, path: "product.bundle\nproduct.bundle.sha256", retention-days: 7}

  runner:
    needs: [trust-gate, discover, fetch]
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      artifact-id: ${{ steps.up.outputs.artifact-id }}
      artifact-digest: ${{ steps.up.outputs.artifact-digest }}
      report_sha256: ${{ steps.rep.outputs.report_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.trust-gate.outputs.verified_sha }}", path: trusted, persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: product-bundle}
      - name: Checkout limpo em /clean/product
        env:
          TARGET: ${{ needs.discover.outputs.target }}
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ ]] || exit 1
          sha256sum -c product.bundle.sha256
          sudo mkdir -p /clean && sudo chown "$USER" /clean
          git clone -q product.bundle /clean/product
          git -C /clean/product -c core.hooksPath=/dev/null checkout -q --detach "$TARGET"
          printf '* -text\n' > /clean/product/.git/info/attributes
          mkdir -p /clean/checks/keys && cp trusted/checks/scripts/*.py /clean/checks/ && cp trusted/keys/*.asc /clean/checks/keys/ && chmod -R a-w /clean/checks
      - name: Imagem do runner
        run: docker build -t ln-runner:local trusted/runner
      - id: rep
        name: Checks (orquestrador no host; testes em container sem rede)
        env:
          TARGET: ${{ needs.discover.outputs.target }}
          TASK: ${{ needs.discover.outputs.task }}
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ && "$TASK" =~ ^R[0-6]-[0-9]{2}$ ]] || exit 1
          mkdir -p /tmp/out
          env -i PATH="$PATH" HOME="$HOME" python3 trusted/kit/clean_checks.py --checkout /clean/product \
            --target "$TARGET" --policy trusted/checks/r0-policy.json --task "$TASK" \
            --output /tmp/out/runner-report.json || echo "checks falharam (relatorio registra fail)"
          s=$(sha256sum /tmp/out/runner-report.json | cut -d' ' -f1); echo "report_sha256=$s" | tee -a "$GITHUB_OUTPUT"
      - id: up
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "runner-report-${{ needs.discover.outputs.task }}-${{ needs.discover.outputs.target }}", path: /tmp/out/runner-report.json, retention-days: 30}

  reviewer:
    needs: [trust-gate, discover, runner]
    runs-on: ubuntu-latest
    environment: reviewer
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.trust-gate.outputs.verified_sha }}", path: trusted, persist-credentials: false}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: product-bundle}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: "runner-report-${{ needs.discover.outputs.task }}-${{ needs.discover.outputs.target }}", path: runner}
      - name: Revisor de outro provedor (R0-06; OpenRouter -> OpenAI, provider.only + allow_fallbacks=false)
        env:
          TARGET: ${{ needs.discover.outputs.target }}
          TASK: ${{ needs.discover.outputs.task }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          REVIEWER_GPG_PRIVATE_KEY: ${{ secrets.REVIEWER_GPG_PRIVATE_KEY }}
          REVIEWER_GPG_PASSPHRASE: ${{ secrets.REVIEWER_GPG_PASSPHRASE }}
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ && "$TASK" =~ ^R[0-6]-[0-9]{2}$ ]] || exit 1
          sha256sum -c product.bundle.sha256
          git clone -q product.bundle /tmp/product
          git -C /tmp/product -c core.hooksPath=/dev/null checkout -q --detach "$TARGET"
          printf '* -text\n' > /tmp/product/.git/info/attributes
          python3 -I -B trusted/reviewer/review.py --product /tmp/product --target "$TARGET" --task "$TASK" \
            --trust trusted/trust.json --config trusted/reviewer/config.json \
            --runner-report runner/runner-report.json --out /tmp/review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with: {name: "review-${{ needs.discover.outputs.task }}-${{ needs.discover.outputs.target }}", path: "/tmp/review/review-tag.txt\n/tmp/review/review-meta.json", retention-days: 30}

  signer:
    needs: [trust-gate, discover, runner, reviewer]
    runs-on: ubuntu-latest
    environment: verifier-signing
    permissions: {contents: read, actions: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {ref: "${{ needs.trust-gate.outputs.verified_sha }}", path: trusted, persist-credentials: false}
      - name: Baixar ZIP do relatorio pela API e validar proveniencia
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUNNER_ARTIFACT_ID: ${{ needs.runner.outputs.artifact-id }}
          RUNNER_ARTIFACT_DIGEST: ${{ needs.runner.outputs.artifact-digest }}
          RUNNER_REPORT_SHA256: ${{ needs.runner.outputs.report_sha256 }}
          TARGET: ${{ needs.discover.outputs.target }}
          TASK: ${{ needs.discover.outputs.task }}
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ && "$TASK" =~ ^R[0-6]-[0-9]{2}$ && "$RUNNER_ARTIFACT_ID" =~ ^[0-9]+$ ]] || exit 1
          curl -sSfL -H "Authorization: Bearer $GITHUB_TOKEN" -o report.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${RUNNER_ARTIFACT_ID}/zip"
          python3 trusted/scripts/provenance.py report.zip trusted/trust.json trusted/checks/r0-policy.json "$TARGET" "$TASK"
      - name: Token da App LN Verifier
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.LN_VERIFIER_APP_CLIENT_ID }}   # app-id e deprecated na v3 (pins.md)
          private-key: ${{ secrets.LN_VERIFIER_APP_PRIVATE_KEY }}
          owner: mzinhoww-svg
          repositories: loyaltynews
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: product-bundle}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: {name: "review-${{ needs.discover.outputs.task }}-${{ needs.discover.outputs.target }}", path: review}
      - name: Assinar checks e aceite (clone limpo, kit do repo verificador; push so das refs validadas)
        env:
          VERIFIER_GPG_PRIVATE_KEY: ${{ secrets.VERIFIER_GPG_PRIVATE_KEY }}
          VERIFIER_GPG_PASSPHRASE: ${{ secrets.VERIFIER_GPG_PASSPHRASE }}
          APP_TOKEN: ${{ steps.app.outputs.token }}
          TARGET: ${{ needs.discover.outputs.target }}
          TASK: ${{ needs.discover.outputs.task }}
          MODE: ${{ needs.discover.outputs.mode }}
        run: |
          [[ "$TARGET" =~ ^[0-9a-f]{40}$ && "$TASK" =~ ^R[0-6]-[0-9]{2}$ && "$MODE" =~ ^(accept|premerge)$ ]] || exit 1
          sha256sum -c product.bundle.sha256
          git clone -q product.bundle /tmp/product
          git -C /tmp/product fetch -q origin 'refs/tags/*:refs/tags/*'
          git -C /tmp/product -c core.hooksPath=/dev/null checkout -q --detach "$TARGET"
          printf '* -text\n' > /tmp/product/.git/info/attributes
          unzip -o -q report.zip -d report
          python3 -I -B trusted/scripts/signer.py --product /tmp/product --target "$TARGET" --task "$TASK" --mode "$MODE" \
            --trust trusted/trust.json --policy trusted/checks/r0-policy.json --runner-report report/runner-report.json \
            --review-tag review/review-tag.txt --review-meta review/review-meta.json \
            --push-url "https://github.com/${PRODUCT_REPO}.git"
